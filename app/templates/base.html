<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}PriceScout{% endblock %} · PriceScout</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/></svg>
        PriceScout
      </a>
      <nav class="nav">
        <a href="/" {% if active == 'home' %}aria-current="page"{% endif %}>Compare</a>
        <a href="/history" {% if active == 'history' %}aria-current="page"{% endif %}>History</a>
      </nav>
    </div>
  </header>
  <main class="container main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      Prices are retrieved directly from the listed websites and may change at any time.
      Always confirm the final price on the retailer's site.
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
